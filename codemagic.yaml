# ─────────────────────────────────────────────────────────────
# NeuralCalm — cloud builds, no local Flutter needed.
# ─────────────────────────────────────────────────────────────

definitions:
  scripts:
    - &create_platforms
      name: Generate native platform folders
      script: |
        cp pubspec.yaml pubspec.keep.yaml
        flutter create . --org com.neuralcalm --project-name neuralcalm --platforms=android,ios
        mv -f pubspec.keep.yaml pubspec.yaml
    - &android_tweaks
      name: Android tweaks (minSdk 26 + INTERNET + Health Connect)
      script: |
        for f in android/app/build.gradle android/app/build.gradle.kts; do
          if [ -f "$f" ]; then sed -i.bak 's/flutter.minSdkVersion/26/g' "$f"; fi
        done
        M=android/app/src/main/AndroidManifest.xml
        if [ -f "$M" ] && ! grep -q "android.permission.INTERNET" "$M"; then
          sed -i.bak 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' "$M"
        fi
        python3 - <<'PYEOF'
        import re
        M='android/app/src/main/AndroidManifest.xml'
        s=open(M).read()
        perms=''.join(f'<uses-permission android:name="android.permission.health.{p}"/>' for p in
          ['READ_STEPS','READ_SLEEP','READ_HEART_RATE','READ_RESTING_HEART_RATE','READ_HEART_RATE_VARIABILITY','READ_OXYGEN_SATURATION','READ_DISTANCE','READ_ACTIVE_CALORIES_BURNED','READ_TOTAL_CALORIES_BURNED','READ_BODY_TEMPERATURE','READ_BLOOD_PRESSURE'])
        if 'health.READ_STEPS' not in s:
            s=s.replace('<application', perms+'<application',1)
        if 'ACTION_SHOW_PERMISSIONS_RATIONALE' not in s:
            ratio='<intent-filter><action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE"/></intent-filter>'
            s=re.sub(r'(<activity\b[^>]*\.MainActivity.*?)</activity>', lambda m: m.group(1)+ratio+'</activity>', s, count=1, flags=re.S)
        if 'ViewPermissionUsageActivity' not in s:
            alias=('<activity-alias android:name="ViewPermissionUsageActivity" android:exported="true" '
                   'android:targetActivity=".MainActivity" android:permission="android.permission.START_VIEW_PERMISSION_USAGE">'
                   '<intent-filter><action android:name="android.intent.action.VIEW_PERMISSION_USAGE"/>'
                   '<category android:name="android.intent.category.HEALTH_PERMISSIONS"/></intent-filter></activity-alias>')
            s=s.replace('</application>', alias+'</application>',1)
        open(M,'w').write(s)
        print('Health Connect manifest entries injected')
        PYEOF
    # iOS: deployment target 15.0 (Firebase needs it), HealthKit
    # entitlement + Info.plist purpose strings (the health plugin
    # links HealthKit, and Apple rejects binaries without these),
    # and encryption compliance so TestFlight does not prompt.
    - &ios_tweaks
      name: iOS tweaks (target 15.0 + HealthKit + purpose strings)
      script: |
        python3 - <<'PYEOF'
        import re, os

        BUNDLE = 'com.neuralcalm.neuralcalm'
        P  = 'ios/Runner.xcodeproj/project.pbxproj'
        IP = 'ios/Runner/Info.plist'
        EN = 'ios/Runner/Runner.entitlements'

        # 1. deployment target -> 15.0
        s = open(P).read()
        s = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;',
                   'IPHONEOS_DEPLOYMENT_TARGET = 15.0;', s)

        # 2. point the target at an entitlements file
        if 'CODE_SIGN_ENTITLEMENTS' not in s:
            s = s.replace(
                'PRODUCT_BUNDLE_IDENTIFIER = %s;' % BUNDLE,
                'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = %s;' % BUNDLE)
        open(P, 'w').write(s)
        print('pbxproj: deployment target 15.0 + entitlements wired')

        # 3. write the entitlements file (HealthKit)
        open(EN, 'w').write(
            '<?xml version="1.0" encoding="UTF-8"?>\n'
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" '
            '"http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
            '<plist version="1.0">\n<dict>\n'
            '\t<key>com.apple.developer.healthkit</key>\n\t<true/>\n'
            '\t<key>com.apple.developer.healthkit.access</key>\n\t<array/>\n'
            '</dict>\n</plist>\n')
        print('Runner.entitlements written (HealthKit)')

        # 4. Info.plist purpose strings + encryption compliance
        s = open(IP).read()
        adds = {
          'NSHealthShareUsageDescription':
            'Neural Calm reads heart rate, heart-rate variability and sleep '
            'data from Apple Health so your Calm Score reflects your own body.',
          'NSHealthUpdateUsageDescription':
            'Neural Calm can save your wellbeing readings back to Apple Health.',
        }
        extra = ''
        for k, v in adds.items():
            if k not in s:
                extra += '\t<key>%s</key>\n\t<string>%s</string>\n' % (k, v)
        if 'ITSAppUsesNonExemptEncryption' not in s:
            extra += '\t<key>ITSAppUsesNonExemptEncryption</key>\n\t<false/>\n'
        if extra:
            i = s.rindex('</dict>')
            s = s[:i] + extra + s[i:]
            open(IP, 'w').write(s)
        print('Info.plist: purpose strings + encryption compliance added')
        PYEOF
    - &pub_get
      name: Get packages
      script: flutter pub get
    - &launcher_icons
      name: Generate app launcher icons
      script: dart run flutter_launcher_icons

workflows:

  android-debug:
    name: Android debug APK
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - keys
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - *create_platforms
      - *android_tweaks
      - *pub_get
      - *launcher_icons
      - name: Build debug APK
        script: flutter build apk --debug --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY --dart-define=ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  android-release:
    name: Android release AAB (Play Store - manual)
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - keys
    scripts:
      - *create_platforms
      - *android_tweaks
      - *pub_get
      - *launcher_icons
      - name: Build release AAB
        script: flutter build appbundle --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY --dart-define=ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  ios-verify:
    name: iOS build check (unsigned - manual)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - keys
    scripts:
      - *create_platforms
      - *ios_tweaks
      - *pub_get
      - *launcher_icons
      - name: Build iOS (unsigned)
        script: flutter build ios --release --no-codesign --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY --dart-define=ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
    artifacts:
      - build/ios/iphoneos/*.app

  ios-testflight:
    name: iOS TestFlight (signed)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: NeuralCalm ASC Key
    environment:
      flutter: stable
      groups:
        - keys
      vars:
        BUNDLE_ID: "com.neuralcalm.neuralcalm"
    scripts:
      - *create_platforms
      - *ios_tweaks
      - *pub_get
      - *launcher_icons
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Set a unique build number
        script: cd $CM_BUILD_DIR/ios && agvtool new-version -all $(($BUILD_NUMBER + 200))
      - name: Build signed IPA
        script: flutter build ipa --release --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY --dart-define=ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
