name: neuralcalm
description: NeuralCalm - measure, understand, and improve your Neural Calm Score.
publish_to: 'none'
version: 0.5.0+9

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.14
  shared_preferences: ^2.3.0
  http: ^1.2.0
  firebase_core: ">=3.6.0 <5.0.0"
  firebase_auth: ">=5.3.0 <7.0.0"
  pdf: ^3.10.0
  printing: ^5.12.0
  health: 11.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ">=0.13.1 <0.15.0"
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"